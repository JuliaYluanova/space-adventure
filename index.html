const sh=(a,s)=>{a=a.slice();let x=s;const R=()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296};for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const arr=(l,ip,sd)=>{const I=l.filter(t=>t.i),R=sh(l.filter(t=>!t.i),sd);let a=0,b=0;return Array.from({length:25},(_,k)=>{const n=k+1,t=ip.includes(n)?I[a++]:R[b++];return Object.assign({},t,{n:String(n)});});};

function mk(spAt,intNums,ic){
  const SP=['🎁','🔄','💌','🎲'];const o=[{cls:'st',num:'СТАРТ',ic:'❤️'}];let a=0,b=0,r=0;
  for(let s=0;s<29;s++){
    if(spAt.includes(s))o.push({cls:'sp',num:'',ic:SP[b++]});
    
    else{r++;const hot=intNums.includes(r);o.push({cls:hot?'i':'n',num:String(r),ic:hot?'🔥❤️':ic});}
  }
  o.push({cls:'fin',num:'ФИНИШ',ic:'💑'});
  const P=[];
  o.forEach((c,k)=>{const r=Math.floor(k/8),j=k%8,n=r==3?7:8,st=r==3?632/6:632/7,col=r%2?n-1-j:j;
    const x=45+col*st,y=46+r*92+(col%2?8:-8),h=(c.cls=='st'||c.cls=='fin')?43:36;
    c.x=Math.round(x-h);c.y=Math.round(y-h);P.push([x,y]);});
  let d='M'+Math.round(P[0][0])+' '+Math.round(P[0][1]);
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=' C'+Math.round(p1[0]+(p2[0]-p0[0])/6)+' '+Math.round(p1[1]+(p2[1]-p0[1])/6)+' '+Math.round(p2[0]-(p3[0]-p1[0])/6)+' '+Math.round(p2[1]-(p3[1]-p1[1])/6)+' '+Math.round(p2[0])+' '+Math.round(p2[1]);}
  return{cells:o,d};
}
const rg=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const rnd=m=>Math.round((Math.random()*2-1)*m);

function fit(){B.querySelectorAll('.fit').forEach(f=>{const s=Math.min(1.45,f.clientWidth/722);f.firstChild.style.transform='scale('+s+')';f.style.height=(370*s)+'px';});}

const KEY='igra-dlya-nas-v1';let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){done={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
function paint(){let n=0;B.querySelectorAll('.cell[data-k]').forEach(c=>{const on=!!done[c.dataset.k];if(on&&!c.classList.contains('st')&&!c.classList.contains('fin'))n++;c.classList.toggle('done',on);c.setAttribute('aria-pressed',on)});document.querySelectorAll('.r[data-k]').forEach(r=>{const on=!!done[r.dataset.k];r.classList.toggle('done',on);r.setAttribute('aria-pressed',on)});document.getElementById('cnt').textContent='Выполнено: '+n+' из 50. Нажимайте на клетки, чтобы отмечать.';}
B.addEventListener('click',e=>{const c=e.target.closest('.cell[data-k]');if(!c||c.classList.contains('st')||c.classList.contains('fin'))return;const k=c.dataset.k;if(done[k])delete done[k];else done[k]=1;save();paint();});
let rt;const rb=document.getElementById('reset');
rb.onclick=()=>{if(rb.dataset.sure){done={};save();paint();rb.textContent='Сбросить отметки';delete rb.dataset.sure;clearTimeout(rt);}else{rb.dataset.sure=1;rb.textContent='Точно сбросить?';rt=setTimeout(()=>{rb.textContent='Сбросить отметки';delete rb.dataset.sure;},3000);}};

document.getElementById('tl').addEventListener('click',e=>{const r=e.target.closest('.r[data-k]');if(!r)return;const k=r.dataset.k;if(done[k])delete done[k];else done[k]=1;save();paint();});
